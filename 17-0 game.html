<title>17-0 — Build Your Team. Go Undefeated.</title>
<style>
:root{
  --bg:#0a0e1a; --card:#131b2e; --card2:#1a2440;
  --line:#243055; --text:#eef2ff; --muted:#8a94b8; --green:#00e676;
  --gold:#ffb612; --red:#ff4d4d;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:dark;}
body{margin:0;background:radial-gradient(ellipse at top,#10192f 0%,var(--bg) 60%);
  color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;}
h1,h2,h3{margin:0 0 8px;letter-spacing:.5px}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px;}
.center{text-align:center}
.logo{font-size:52px;font-weight:900;letter-spacing:2px;
  background:linear-gradient(180deg,#fff,var(--green));-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 40px rgba(0,230,118,.25);}
.sub{color:var(--muted);margin-bottom:28px;font-size:14px;letter-spacing:1px;text-transform:uppercase}
.menu-btn{display:block;width:100%;padding:16px;margin-bottom:12px;border-radius:12px;
  border:1px solid var(--line);background:linear-gradient(180deg,var(--card2),var(--card));
  color:var(--text);font-size:16px;font-weight:700;text-align:left;position:relative;}
.menu-btn:active{transform:scale(.98)}
.menu-btn .tag{position:absolute;right:14px;top:50%;transform:translateY(-50%);
  font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.menu-btn.primary{background:linear-gradient(180deg,#00c853,#009e46);color:#04210f;border:none;font-size:18px}
.menu-btn.disabled{opacity:.45;cursor:default}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;
  letter-spacing:.5px;text-transform:uppercase;}
.badge-green{background:rgba(0,230,118,.15);color:var(--green);border:1px solid rgba(0,230,118,.4)}
.badge-gold{background:rgba(255,182,18,.15);color:var(--gold);border:1px solid rgba(255,182,18,.4)}
.progress{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0 2px;}
.progress>div{height:100%;background:linear-gradient(90deg,var(--green),var(--gold))}
.rollzone{text-align:center;padding:30px 10px}
.rollbtn{padding:20px 30px;border-radius:14px;border:none;font-size:18px;font-weight:900;
  background:linear-gradient(180deg,var(--gold),#d99500);color:#2a1a00;box-shadow:0 8px 24px rgba(255,182,18,.25)}
.rollbtn:active{transform:scale(.96)}
.teamreveal{text-align:center;padding:6px 0 14px}
.teamreveal .swatch{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:middle}
.teamreveal .tn{font-size:20px;font-weight:900}
.teamreveal .hc{color:var(--muted);font-size:12px}
.candgrid{display:flex;flex-direction:column;gap:8px}
.candcard{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;color:var(--text);font-weight:800;font-size:15px}
.candcard:active{transform:scale(.98)}
.candcard .meta{display:block;color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.roster-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.rslot{display:flex;justify-content:space-between;padding:8px 10px;border-radius:8px;background:var(--card2);
  border:1px solid var(--line);font-size:13px}
.rslot.empty{opacity:.4;font-style:italic}
.rslot b{color:var(--gold);width:46px;display:inline-block}
.btnrow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;padding:13px;border-radius:10px;border:1px solid var(--line);
  background:var(--card2);color:var(--text);font-weight:700;font-size:14px}
.btn.gold{background:linear-gradient(180deg,var(--gold),#d99500);color:#2a1a00;border:none}
.btn.green{background:linear-gradient(180deg,#00e676,#00a854);color:#04210f;border:none}
.btn:disabled{opacity:.35}
.backbtn{background:none;border:none;color:var(--muted);font-size:13px;margin-bottom:10px;padding:6px 0}
.gamelog{max-height:340px;overflow-y:auto;margin-top:10px;border-top:1px solid var(--line)}
.glrow{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13px}
.glrow .w{color:var(--green);font-weight:800}
.glrow .l{color:var(--red);font-weight:800}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stat{background:var(--card2);border-radius:10px;padding:12px;text-align:center}
.stat .v{font-size:22px;font-weight:900}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.searchbar{position:relative;margin:4px 0 12px}
.searchbar input{width:100%;padding:14px 44px 14px 42px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:16px;font-family:inherit;outline:none;-webkit-appearance:none;appearance:none}
.searchbar input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,230,118,.15)}
.searchbar .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none;opacity:.7}
.searchbar .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:none;background:var(--line);color:var(--text);font-size:16px;line-height:1;display:none}
.searchbar.has .clr{display:block}
.candcard{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%}
.candcard .l{min-width:0}
.candcard .ovr{flex:none;text-align:center;font-size:18px;font-weight:900;color:var(--green);line-height:1}
.candcard .ovr small{display:block;font-size:9px;color:var(--muted);font-weight:600;letter-spacing:.5px;margin-top:3px}
.nomatch{text-align:center;color:var(--muted);padding:18px 8px;font-size:14px;background:var(--card2);border:1px dashed var(--line);border-radius:12px}
.nomatch button{margin-top:10px;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:700}
.slotchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px;justify-content:center}
.chip{padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;border:1px solid var(--line)}
.chip.open{color:var(--green);border-color:rgba(0,230,118,.5);background:rgba(0,230,118,.1)}
.chip.done{color:var(--muted);text-decoration:line-through;opacity:.5}
.rescount{font-size:11px;color:var(--muted);margin:0 2px 8px;text-transform:uppercase;letter-spacing:.5px}
.coachlist{max-height:440px;overflow-y:auto}
.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:20px}
</style>
</head>

const SLOTS=ROUNDS; // 9 fixed roster slots (order is display only; no round has a predetermined position)
function freshState(){return {screen:"draft",round:0,roster:[],slots:Array(9).fill(null),used:new Set(),rerolls:2,rolledTeam:null,rollCandidates:[],query:"",season:null};}
let S={screen:"menu",round:0,roster:[],slots:Array(9).fill(null),used:new Set(),rerolls:2,rolledTeam:null,rollCandidates:[],query:"",season:null};

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function swatch(team){return `<span class="swatch" style="background:${TEAMS[team]||'#888'}"></span>`}

function newDraft(){S=freshState();render();}
function openSlotIndex(pos){return S.slots.findIndex((x,i)=>x===null&&SLOTS[i]===pos);}
function openCount(pos){return S.slots.filter((x,i)=>x===null&&SLOTS[i]===pos).length;}
// All options from a team the user may still take: any position whose slot is open, no duplicates.
function candidatesForTeam(team){
  const out=[];
  PLAYERS.forEach(p=>{if(p.t===team&&openCount(p.p)>0&&!S.used.has(p.n))out.push(p);});
  if(openCount("HC")>0&&COACHES[team]&&!S.used.has(COACHES[team]))out.push({n:COACHES[team],t:team,p:"HC",o:HC_RATING[team]});
  if(openCount("OL")>0)out.push({n:"Offensive Line",t:team,p:"OL",o:OL_RATING[team],unit:1});
  if(openCount("DEF")>0)out.push({n:"Defense",t:team,p:"DEF",o:DEF_RATING[team],unit:1});
  const order={QB:0,RB:1,WR:2,TE:3,HC:4,OL:5,DEF:6};
  return out.sort((a,b)=>order[a.p]-order[b.p]||b.o-a.o);
}
// Only the team is random. Never roll a team with nothing selectable.
function rollTeam(){
  const teams=Object.keys(TEAMS).filter(t=>candidatesForTeam(t).length>0);
  const team=teams[Math.floor(Math.random()*teams.length)];
  S.rolledTeam=team;S.rollCandidates=candidatesForTeam(team);S.query="";
  render();
}
function pickCandidate(i){
  const c=S.rollCandidates[i];
  if(!c)return;
  const idx=openSlotIndex(c.p);
  if(idx<0||S.used.has(c.n))return; // slot already filled / duplicate: blocked
  S.slots[idx]=c;S.roster.push(c);S.used.add(c.n);
  S.round=S.roster.length;S.rolledTeam=null;S.rollCandidates=[];S.query="";
  if(S.round>=9)S.screen="summary";
  render();
}
function reroll(){ if(S.rerolls<=0)return; S.rerolls--; rollTeam(); }
function strength(){
  const avg=S.roster.reduce((s,p)=>s+p.o,0)/S.roster.length;
  return avg;
}
function simSeason(){
  const str=strength();
  const ALL=Object.keys(TEAMS);
  const opps=shuffle(ALL).slice(0,17);
  let wins=0,losses=0,pf=0,pa=0;const log=[];
  opps.forEach(opp=>{
    const oppStr=75+Math.random()*20;
    const diff=str-oppStr;
    const winProb=Math.min(0.92,Math.max(0.08,0.5+diff*0.02));
    const win=Math.random()<winProb;
    let ys=Math.max(6,Math.round(14+str/6+(Math.random()*14-7)));
    let os=Math.max(6,Math.round(14+oppStr/6+(Math.random()*14-7)));
    if(win && ys<=os) ys=os+Math.ceil(Math.random()*7)+1;
    if(!win && os<=ys) os=ys+Math.ceil(Math.random()*7)+1;
    if(win){wins++}else{losses++}
    pf+=ys;pa+=os;
    log.push({opp,win,ys,os});
  });
  const perfect=wins===17;
  let best={wins:0,perfect:0};
  try{const saved=localStorage.getItem('nfl170_best');if(saved)best=JSON.parse(saved);}catch(e){}
  if(wins>best.wins)best.wins=wins;
  if(perfect)best.perfect=(best.perfect||0)+1;
  try{localStorage.setItem('nfl170_best',JSON.stringify(best));}catch(e){}
  S.season={wins,losses,pf,pa,log,perfect,str:Math.round(str)};
  S.screen="results";
  render();
}
function leaderboard(){
  let best={wins:0,perfect:0};
  try{const saved=localStorage.getItem('nfl170_best');if(saved)best=JSON.parse(saved);}catch(e){}
  S.screen="leaderboard";S._lb=best;render();
}

function norm(t){return String(t).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[.'’`\-]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();}
function lev(a,b,max){
  if(Math.abs(a.length-b.length)>max)return max+1;
  let prev=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){
    const cur=[i];let min=i;
    for(let j=1;j<=b.length;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
      if(cur[j]<min)min=cur[j];
    }
    if(min>max)return max+1;
    prev=cur;
  }
  return prev[b.length];
}
const NICK={pat:"patrick",mike:"michael",chris:"christopher",cj:"cj",dj:"dj",aj:"aj",jr:"jr",tj:"tj",ceedee:"ceedee",deandre:"dandre",saq:"saquon",cmc:"christian mccaffrey",juju:"jujuan"};
function matchToken(q,tokens){
  for(const w of tokens){
    if(w.startsWith(q)||(q.length>=3&&w.includes(q)))return 1;
  }
  if(q.length>=4){
    const max=q.length>=7?2:1;
    for(const w of tokens){
      if(lev(q,w.slice(0,Math.min(w.length,q.length+1)),max)<=max||lev(q,w,max)<=max)return 2;
    }
  }
  return 0;
}
function searchHaystack(c){
  let extra="";
  if(c.p==="HC")extra=" head coach hc";
  if(c.p==="OL")extra=" offensive line ol oline";
  if(c.p==="DEF")extra=" defense defence def";
  if(c.p==="QB")extra=" quarterback";
  if(c.p==="RB")extra=" running back halfback";
  if(c.p==="WR")extra=" wide receiver";
  if(c.p==="TE")extra=" tight end";
  return norm(c.n+extra);
}
function filterCands(){
  const q=norm(S.query||"");
  const all=S.rollCandidates.map((c,i)=>({c,i}));
  if(!q)return all;
  const qt=q.split(" ").filter(Boolean).map(w=>NICK[w]?norm(NICK[w]):w);
  const flat=qt.join(" ").split(" ").filter(Boolean);
  const res=[];
  all.forEach(({c,i})=>{
    const hay=searchHaystack(c);
    const tokens=hay.split(" ");
    const nospace=hay.replace(/ /g,"");
    let score=0,ok=true;
    for(const w of flat){
      const m=matchToken(w,tokens);
      if(m)score+=m;
      else if(nospace.includes(w))score+=1;
      else{ok=false;break;}
    }
    if(ok)res.push({c,i,score});
  });
  return res.sort((a,b)=>a.score-b.score);
}
function candHTML(){
  const list=filterCands();

}

    <h2>✅ Draft Complete</h2>
    <div class="statgrid">
      <div class="stat"><div class="v">${Math.round(strength())}</div><div class="k">Team Strength</div></div>
    </div>
  </div>
  <div class="panel">
    <h3>Final Roster</h3>
    <div class="roster-list">${rosterRows}</div>
    <div class="btnrow">
      <button class="btn green" onclick="simSeason()">▶ Simulate 17-Game Season</button>
    </div>
  </div>`;
}
function resultsView(){
  const r=S.season;
  const log=r.log.map(g=>`<div class="glrow"><span>vs ${g.opp}</span><span class="${g.win?'w':'l'}">${g.win?'W':'L'} ${g.ys}-${g.os}</span></div>`).join("");
  const strongest=S.roster.reduce((a,b)=>b.o>a.o?b:a);
  return `
  <div class="panel center">
    <h2>${r.perfect?'🏆 PERFECT SEASON!':'Season Complete'}</h2>
    <div class="logo" style="font-size:40px">${r.wins}-${r.losses}</div>
  </div>
  <div class="panel">
    <div class="statgrid">
      <div class="stat"><div class="v">${r.pf}</div><div class="k">Points For</div></div>
      <div class="stat"><div class="v">${r.pa}</div><div class="k">Points Against</div></div>
      <div class="stat"><div class="v">${r.str}</div><div class="k">Team Strength</div></div>
      <div class="stat"><div class="v">${strongest.n}</div><div class="k">Strongest Pick</div></div>
    </div>
    <div class="gamelog">${log}</div>
  </div>
  <div class="btnrow">
    <button class="btn gold" onclick="newDraft()">🔁 Draft Again</button>
    <button class="btn" onclick="goto('menu')">Main Menu</button>
  </div>`;
}
render();
</script>
</body>
</html>
